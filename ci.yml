name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check index.html exists
        run: test -f index.html && echo "index.html found"

      - name: Check file size
        run: |
          SIZE=$(wc -c < index.html)
          echo "index.html size: ${SIZE} bytes"
          if [ $SIZE -gt 500000 ]; then
            echo "index.html is too large (>500KB). Keep it lean."
            exit 1
          fi
          echo "File size OK"

      - name: Check no external scripts added
        run: |
          SCRIPTS=$(grep -c '<script src=' index.html || true)
          echo "External scripts found: $SCRIPTS"
          if [ $SCRIPTS -gt 1 ]; then
            echo "More than 1 external script detected. Verify this is intentional."
          fi
          echo "Script check done"